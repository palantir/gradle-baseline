buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }

    dependencies {
        classpath 'com.palantir.jakartapackagealignment:jakarta-package-alignment:0.6.0'
        classpath 'com.palantir.gradle.jdks:gradle-jdks:0.69.0'
        classpath 'com.palantir.gradle.jdkslatest:gradle-jdks-latest:0.21.0'
        classpath 'com.diffplug.gradle:goomph:3.32.1'
        classpath 'com.palantir.gradle.externalpublish:gradle-external-publish-plugin:1.24.0'
        classpath 'com.palantir.gradle.failure-reports:gradle-failure-reports:1.14.0'
        classpath 'com.palantir.gradle.guide:gradle-guide:1.13.0'
        classpath 'com.palantir.gradle.idea-configuration:gradle-idea-configuration:0.5.0'
        classpath 'com.palantir.gradle.consistentversions:gradle-consistent-versions:3.2.0'
        classpath 'com.palantir.gradle.plugintesting:gradle-plugin-testing:0.11.0'
        classpath 'com.gradle.publish:plugin-publish-plugin:1.3.1'
        classpath 'com.palantir.baseline:gradle-baseline-java:6.54.0'
        classpath 'com.palantir.javaformat:gradle-palantir-java-format:2.73.0'
        classpath 'com.palantir.suppressible-error-prone:gradle-suppressible-error-prone:2.15.0'
    }
}

plugins {
id 'com.palantir.git-version' version '4.0.0'
}

apply plugin: 'com.palantir.external-publish'
apply plugin: 'com.palantir.failure-reports'
apply plugin: 'com.palantir.gradle-guide'
apply plugin: 'com.palantir.jdks'
apply plugin: 'com.palantir.consistent-versions'
apply plugin: 'com.palantir.baseline'
apply plugin: 'com.palantir.baseline-java-versions'
apply plugin: 'com.palantir.jdks.latest'

allprojects {
    repositories {
        mavenCentral() { metadataSources { mavenPom(); ignoreGradleMetadataRedirection() } }
        gradlePluginPortal()
    }

    // Since we are using gradle-baseline in gradle-baseline we need to undo forces on project dependencies. Following
    // snippet forces the version to be the version originally resolved by gradle and not the force that nebula forced
    // it to.
    configurations.all { c ->
        c.resolutionStrategy { preferProjectModules() }
    }

    pluginManager.withPlugin('java') {
        tasks.withType(JavaCompile) {
            options.compilerArgs += ['-Werror', '-Xlint:deprecation']
            options.errorprone {
                // Temporarily disable some checks. Remove these line after upgrading Baseline.
                disable("DangerousIdentityKey")
                disable("ExecutorSubmitRunnableFutureIgnored")
                disable("IllegalSafeLoggingArgument")
                disable("ReadReturnValueIgnored")
                disable("UnsafeGaugeRegistration")
                disable("VarUsage")
                // End temporary disabled checks.

                disable("Slf4jLogsafeArgs")
                disable("PreferSafeLoggableExceptions")
                disable("PreferSafeLogger")
                disable("PreferSafeLoggingPreconditions")
                disable("PreconditionsConstantMessage")
            }
        }
    }

    pluginManager.withPlugin('net.ltgt.errorprone') {
        dependencies {
            // This forces all errorprone configurations to use the same versions of dependencies used in the baseline-error-prone
            // repo at the time the baseline-error-prone was published (notably, the same version of error-prone itself). This
            // only works as GCV includes all the constraints from the `versions.props` in the `<dependencyManagement>` section
            // of the pom (like a bom would). We need this as when there are error-prone breaks, if the version of
            // error-prone is forced to be the same between the error-prone running this build and the error-prone being
            // used for compilation, we can't move past the breaks as our baseline-error-prones in this build are broken by
            // the new version of error-prone. So we force error-prone in this build back to the version that
            // baseline-error-prone expects while still using the new error-prone for compilation.
            // This trick could conceivable be used for suppressible-error-prone consumers in the gradle-suppressible-error-prone
            // plugin, but this would stop the version of error_prone_core etc lining up with error_prone_annotation(s) that
            // is being used by dependencies, which is less than ideal.
            // If baseline-error-prone was ever moved out of the gradle-baseline repo, this would not be needed in
            // gradle-baseline anymore.
            errorprone enforcedPlatform('com.palantir.baseline:baseline-error-prone')
        }
    }

    apply plugin: 'com.palantir.java-format'
    apply plugin: 'com.palantir.jakarta-package-alignment'

    group = 'com.palantir.baseline'
    version System.env.CIRCLE_TAG ?: gitVersion()
    description = 'A Gradle plugin for applying Baseline-recommended build and IDE settings'
}

javaVersions {
    libraryTarget = 17
}

jdks {
    daemonTarget = 21
}
