buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.palantir.gradle.jdks:gradle-jdks-settings:0.69.0'
    }
}
apply plugin: 'com.palantir.jdks.settings'
rootProject.name = "gradle-baseline"

include "baseline-error-prone"
include 'baseline-module-jvm-args-compiler-plugins'
include "baseline-null-away"
include "gradle-baseline-java"
include "gradle-baseline-java:test-compiler-plugins"
include "gradle-baseline-java-config"
