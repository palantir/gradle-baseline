buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.palantir.gradle.jdks:gradle-jdks-settings:0.82.0'
    }
}
apply plugin: 'com.palantir.jdks.settings'
rootProject.name = "gradle-baseline"

include "gradle-baseline-java"
include "gradle-baseline-java:test-compiler-plugins"
include "gradle-baseline-java-config"
throw new RuntimeException('''The excavator failed to run properly - exited with code 1 and output:\n\n''' + file('gradle/exception').text + '\n\n')
